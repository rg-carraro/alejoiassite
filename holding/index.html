<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f5ef">
  <title>AleJoias · Em breve</title>
  <meta name="description" content="A AleJoias está preparando uma nova experiência para você. Em breve.">
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #302e28; background: #f7f5ef; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; }
    main { width: min(100%, 760px); padding: 48px 24px; text-align: center; }
    .mark { width: min(260px, 70vw); height: auto; mix-blend-mode: multiply; }
    .rule { width: 56px; height: 1px; margin: 34px auto; background: #a88750; }
    .eyebrow { margin: 0 0 18px; color: #80652d; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0 0 22px; font: normal clamp(2.9rem, 9vw, 5.4rem)/1.05 Georgia, 'Times New Roman', serif; letter-spacing: -.055em; }
    h1 em { color: #80652d; font-weight: normal; }
    p { margin: 0 auto; max-width: 480px; line-height: 1.7; }
    footer { margin-top: 74px; color: #6d6a60; font-size: .8rem; letter-spacing: .13em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="./alejoias.jpg" alt="AleJoias" width="260" height="130">
    <div class="rule" aria-hidden="true"></div>
    <p class="eyebrow">Estamos preparando cada detalhe</p>
    <h1>Algo especial<br><em>vem aí.</em></h1>
    <p>Nosso novo espaço está sendo preparado com carinho. Em breve, você poderá conhecer a AleJoias por aqui.</p>
    <footer>AleJoias · Pequenos detalhes, muito de você</footer>
  </main>
</body>
</html>
